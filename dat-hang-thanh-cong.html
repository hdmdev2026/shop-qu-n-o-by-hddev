<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Hàng Thành Công - HD&ConBoStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #030510 url('images/space-bg.jpg') no-repeat center center fixed !important;
            background-size: cover !important; color: #ffffff !important;
            font-family: 'Quicksand', sans-serif; overflow-x: hidden; min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .overlay-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(3, 5, 16, 0.85); z-index: -1; }
        #star-network-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; }

        .success-box {
            background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(15px);
            border: 2px solid #00e5ff; border-radius: 20px; padding: 50px 40px;
            text-align: center; max-width: 600px; width: 90%; position: relative; z-index: 2;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.3);
            animation: zoomIn 0.5s ease;
        }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .icon-success { font-size: 80px; color: #10b981; margin-bottom: 20px; filter: drop-shadow(0 0 15px #10b981); }
        h1 { color: #00e5ff; font-size: 32px; margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 0 10px #00e5ff; }
        p { font-size: 18px; color: #e2e8f0; line-height: 1.6; margin-bottom: 15px; }
        .highlight { color: #ff007f; font-weight: bold; }
        
        .order-summary { background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 10px; padding: 20px; margin: 30px 0; text-align: left; }
        .order-summary p { font-size: 15px; margin-bottom: 10px; }

        .btn-home {
            display: inline-block; padding: 15px 40px; background: linear-gradient(135deg, #0055ff, #00e5ff);
            color: #fff; text-decoration: none; font-weight: bold; font-size: 16px;
            border-radius: 30px; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
        }
        .btn-home:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 229, 255, 0.6); }
    </style>
</head>
<body>
    <div class="overlay-bg"></div>
    <canvas id="star-network-canvas"></canvas>

    <div class="success-box">
        <div class="icon-success">✔️</div>
        <h1>Đặt Hàng Thành Công!</h1>
        <p>Cảm ơn bạn đã mua sắm tại <strong>HD&ConBoStore</strong>.</p>
        <p>Đơn hàng của bạn đã được tiếp nhận và đang trong quá trình xử lý.</p>
        
        <div class="order-summary" id="order-details">
            <!-- Sẽ render chi tiết đơn hàng bằng JS -->
        </div>

        <p>Dự kiến hàng sẽ về trong khoảng <span class="highlight">1 - 7 ngày</span> làm việc.</p>
        <p>Chúng tôi sẽ sớm liên hệ với bạn qua số điện thoại để xác nhận đơn hàng.</p>

        <a href="index.html" class="btn-home">Quay Lại Trang Chủ</a>
    </div>

    <script>
        // HIỆU ỨNG SAO
        const canvas = document.getElementById('star-network-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, stars = [], mouse = { x: null, y: null };
        function resizeCanvas() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; initStars(); }
        window.addEventListener('resize', resizeCanvas);
        class Star { constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5; this.radius = Math.random() * 1.5 + 0.5; } update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; } draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.fill(); } }
        function initStars() { stars = []; for (let i = 0; i < 120; i++) stars.push(new Star()); }
        function animateStars() { ctx.clearRect(0, 0, width, height); stars.forEach(s => { s.update(); s.draw(); }); requestAnimationFrame(animateStars); }
        resizeCanvas(); animateStars();

        // HIỂN THỊ CHI TIẾT ĐƠN HÀNG (Nếu có lưu)
        window.onload = function() {
            const lastOrder = JSON.parse(localStorage.getItem("last_order"));
            if (lastOrder) {
                let itemsHtml = lastOrder.items.map(item => `<div>- ${item.name} (Size ${item.size}) x ${item.quantity}: <span style="color:#00e5ff">${(item.price * item.quantity).toLocaleString('vi-VN')}đ</span></div>`).join('');
                document.getElementById('order-details').innerHTML = `
                    <p><strong>Người nhận:</strong> ${lastOrder.customer}</p>
                    <p><strong>SĐT:</strong> ${lastOrder.phone}</p>
                    <p><strong>Địa chỉ:</strong> ${lastOrder.address}</p>
                    <p><strong>Sản phẩm:</strong></p>
                    <div style="margin-bottom: 15px; padding-left: 10px;">${itemsHtml}</div>
                    <p style="border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 10px; font-size: 18px;">
                        <strong>Tổng thanh toán:</strong> <span style="color:#ff007f; font-weight:bold;">${lastOrder.total.toLocaleString('vi-VN')}đ</span>
                    </p>
                `;
                // Xóa dữ liệu đơn hàng sau khi hiển thị để tránh việc F5 trang bị lặp lại
                localStorage.removeItem("last_order");
            }
        }
    </script>
</body>
</html>
