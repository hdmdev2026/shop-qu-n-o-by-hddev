<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - HD&ConBoStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #030510 url('images/space-bg.jpg') no-repeat center center fixed !important;
            background-size: cover !important; color: #ffffff !important;
            font-family: 'Quicksand', sans-serif; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column;
        }
        .overlay-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(3, 5, 16, 0.85); z-index: -1; }
        #star-network-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; }

        .header-cart { background: rgba(10, 15, 30, 0.9); padding: 20px; text-align: center; border-bottom: 1px solid rgba(0, 229, 255, 0.3); position: relative; z-index: 2; }
        .header-cart h1 { color: #00e5ff; text-transform: uppercase; text-shadow: 0 0 10px #00e5ff; font-size: 28px; }

        .cart-container { max-width: 1000px; margin: 40px auto; width: 95%; display: flex; gap: 30px; position: relative; z-index: 2; }
        @media (max-width: 768px) { .cart-container { flex-direction: column; } }

        .cart-items-box { flex: 1.5; background: rgba(10, 15, 30, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 15px; padding: 25px; }
        .cart-items-box h2 { font-size: 20px; margin-bottom: 20px; color: #00e5ff; border-bottom: 1px solid rgba(0,229,255,0.2); padding-bottom: 10px; }
        
        .cart-item { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .cart-item img { width: 80px; height: 100px; object-fit: contain; border-radius: 8px; background: #fff; border: 1px solid rgba(0,229,255,0.3); }
        .item-info { flex: 1; }
        .item-info h4 { font-size: 16px; color: #fff; margin-bottom: 5px; }
        .item-info p { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .item-info .item-price { color: #ff007f; font-weight: bold; font-size: 16px; }
        .btn-remove { background: transparent; border: 1px solid #ff007f; color: #ff007f; padding: 5px 10px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-remove:hover { background: #ff007f; color: #fff; }

        .checkout-box { flex: 1; background: rgba(10, 15, 30, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 15px; padding: 25px; height: fit-content; }
        .checkout-box h2 { font-size: 20px; margin-bottom: 20px; color: #00e5ff; border-bottom: 1px solid rgba(0,229,255,0.2); padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; color: #e2e8f0; margin-bottom: 8px; font-weight: 600; }
        .form-control { width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 8px; color: #fff; outline: none; transition: 0.3s; }
        .form-control:focus { border-color: #00e5ff; box-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }

        .total-price { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 20px; border-top: 2px dashed rgba(0, 229, 255, 0.4); font-size: 18px; font-weight: bold; }
        .total-price span { color: #ff007f; font-size: 22px; }

        .btn-checkout { width: 100%; padding: 15px; background: linear-gradient(135deg, #0055ff, #00e5ff); border: none; border-radius: 8px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-checkout:disabled { background: #4b5563; cursor: not-allowed; box-shadow: none; }
        .btn-checkout:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 229, 255, 0.6); }

        .empty-cart { text-align: center; padding: 50px 0; color: #aaa; font-size: 18px; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #00e5ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="overlay-bg"></div>
    <canvas id="star-network-canvas"></canvas>

    <div class="header-cart">
        <h1>Giỏ Hàng Của Bạn</h1>
    </div>

    <div class="cart-container">
        <div class="cart-items-box">
            <h2>Sản phẩm đã chọn</h2>
            <div id="cart-list"></div>
        </div>

        <div class="checkout-box">
            <h2>Thông tin giao hàng</h2>
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="customer-name" class="form-control" placeholder="Nhập họ tên..." oninput="saveCustomerInfo()">
            </div>
            <div class="form-group">
                <label>Số điện thoại *</label>
                <input type="tel" id="customer-phone" class="form-control" placeholder="Nhập số điện thoại..." oninput="saveCustomerInfo()">
            </div>
            <div class="form-group">
                <label>Địa chỉ nhận hàng *</label>
                <textarea id="customer-address" class="form-control" rows="3" placeholder="Nhập địa chỉ chi tiết..." oninput="saveCustomerInfo()"></textarea>
            </div>

            <div class="total-price">
                Tổng tiền: <span id="total-amount">0đ</span>
            </div>

            <button class="btn-checkout" id="btn-checkout" onclick="placeOrder()" disabled>Mua Hàng</button>
            <a href="index.html" class="back-link">← Tiếp tục mua sắm</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('star-network-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, stars = [], mouse = { x: null, y: null };
        function resizeCanvas() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; initStars(); }
        window.addEventListener('resize', resizeCanvas);
        class Star { constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5; this.radius = Math.random() * 1.5 + 0.5; } update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; } draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.fill(); } }
        function initStars() { stars = []; for (let i = 0; i < 120; i++) stars.push(new Star()); }
        function animateStars() { ctx.clearRect(0, 0, width, height); stars.forEach(s => { s.update(); s.draw(); }); requestAnimationFrame(animateStars); }
        resizeCanvas(); animateStars();

        const API_BASE_URL = 'http://180.93.194.227:3000';
        let cartData = [];

        // TỰ ĐỘNG ĐIỀN THÔNG TIN ĐÃ LƯU
        function loadCustomerInfo() {
            const savedInfo = JSON.parse(localStorage.getItem("hddev_customer_info"));
            if (savedInfo) {
                document.getElementById('customer-name').value = savedInfo.name || '';
                document.getElementById('customer-phone').value = savedInfo.phone || '';
                document.getElementById('customer-address').value = savedInfo.address || '';
            }
        }

        // TỰ ĐỘNG LƯU THÔNG TIN KHI GÕ
        function saveCustomerInfo() {
            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();
            
            // Chỉ lưu nếu có ít nhất 1 trường có dữ liệu
            if (name || phone || address) {
                localStorage.setItem("hddev_customer_info", JSON.stringify({ name, phone, address }));
            }
            checkForm(); // Cập nhật trạng thái nút mua hàng
        }

        function loadCart() {
            cartData = JSON.parse(localStorage.getItem("hddev_cart")) || [];
            const cartList = document.getElementById('cart-list');
            const totalEl = document.getElementById('total-amount');
            
            if (cartData.length === 0) {
                cartList.innerHTML = '<div class="empty-cart">Giỏ hàng của bạn đang trống! <br><a href="index.html" style="color:#00e5ff; margin-top:10px; display:inline-block;">Quay lại mua sắm</a></div>';
                totalEl.innerText = '0đ';
                document.getElementById('btn-checkout').disabled = true;
                return;
            }

            let html = '';
            let total = 0;

            cartData.forEach((item, index) => {
                total += item.price * item.quantity;
                const itemImg = item.image ? (item.image.startsWith('http') ? item.image : API_BASE_URL + item.image) : 'images/logo-hddev.png';
                
                html += `
                    <div class="cart-item">
                        <img src="${itemImg}" alt="${item.name}">
                        <div class="item-info">
                            <h4>${item.name}</h4>
                            <p>Size: ${item.size} | Số lượng: ${item.quantity}</p>
                            <div class="item-price">${(item.price * item.quantity).toLocaleString('vi-VN')}đ</div>
                        </div>
                        <button class="btn-remove" onclick="removeItem(${index})">Xóa</button>
                    </div>
                `;
            });

            cartList.innerHTML = html;
            totalEl.innerText = total.toLocaleString('vi-VN') + 'đ';
            checkForm();
        }

        function removeItem(index) {
            cartData.splice(index, 1);
            localStorage.setItem("hddev_cart", JSON.stringify(cartData));
            loadCart();
        }

        function checkForm() {
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();
            const btn = document.getElementById('btn-checkout');

            if (cartData.length > 0 && phone.length >= 9 && address.length >= 5) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }
        }

        async function placeOrder() {
            const name = document.getElementById('customer-name').value.trim() || 'Khách';
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();
            const total = cartData.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            let userEmail = 'guest';
            const savedUser = JSON.parse(localStorage.getItem("hddev_user"));
            if (savedUser && savedUser.email) userEmail = savedUser.email;

            const orderData = {
                customerName: name,
                phone: phone,
                address: address,
                userEmail: userEmail,
                items: cartData,
                total: total,
                discount: 0
            };

            const btn = document.getElementById('btn-checkout');
            btn.innerText = 'Đang xử lý...';
            btn.disabled = true;

            try {
                // Lưu lại lần cuối trước khi đặt
                localStorage.setItem("hddev_customer_info", JSON.stringify({ name, phone, address }));

                const response = await fetch(`${API_BASE_URL}/api/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    localStorage.setItem("last_order", JSON.stringify({ ...orderData, date: new Date().toLocaleString('vi-VN') }));
                    localStorage.removeItem("hddev_cart"); // Xóa giỏ hàng
                    window.location.href = "dat-hang-thanh-cong.html";
                } else {
                    alert("Lỗi đặt hàng: " + result.message);
                    btn.innerText = 'Mua Hàng';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Lỗi:", error);
                alert("Không thể kết nối đến máy chủ VPS. Vui lòng thử lại!");
                btn.innerText = 'Mua Hàng';
                btn.disabled = false;
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            loadCustomerInfo(); // Load thông tin cũ
            loadCart();
        });
    </script>
</body>
</html>
